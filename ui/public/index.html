<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>dockmaster</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/console.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<header class="topbar">
  <div class="wordmark"><span class="wordmark-cleat" aria-hidden="true"></span>dockmaster</div>
  <p class="pulse" id="pulse"></p>
  <div class="topbar-actions">
    <button type="button" class="btn" id="refresh" title="Re-read the fleet, including every pull request">Refresh</button>
    <button type="button" class="btn" id="focus-toggle" aria-pressed="false">Focus the chat</button>
    <button type="button" class="btn" id="chat-toggle" aria-expanded="false" aria-controls="chat">Chat</button>
    <button type="button" class="btn" id="theme-toggle">Light</button>
  </div>
</header>

<p class="banner banner-demo" id="demo-bar" hidden>
  <span class="lamp lamp-brass" aria-hidden="true"></span>
  <span>Demo fleet — invented work, invented repos. Nothing here is yours.</span>
</p>
<p class="banner banner-stale" id="stale" hidden>
  <span class="lamp lamp-brass" aria-hidden="true"></span>
  <span id="stale-text"></span>
</p>

<!-- The beacon. Something is stopped until the operator acts, so it is said
     full width above every panel rather than only on the one panel they might
     not be looking at. -->
<div class="beacon" id="beacon" role="status" hidden></div>

<div class="deck">
  <nav class="rail" id="rail" aria-label="Console sections"></nav>

  <main class="view" id="view" tabindex="-1"></main>

  <aside class="chat" id="chat" aria-label="Conversation with the dockmaster">
    <header class="chat-head">
      <span class="eyebrow">Conversation</span>
      <button type="button" class="btn btn-quiet" id="chat-close" aria-label="Close the conversation">Close</button>
    </header>
    <div class="chat-log" id="chat-log" role="log" aria-live="polite">
      <div class="chat-empty" id="chat-empty" hidden>
        <p class="empty-head">Say what you need.</p>
        <p class="empty-note">Ask for work, answer a question, or ask what is going on.
          The dockmaster picks this up the next time it looks.</p>
      </div>
      <!-- A day of status lines is a wall. The older ones fold away here rather
           than being dropped, so the conversation stays readable and complete. -->
      <details class="chat-archive" id="chat-archive" hidden>
        <summary class="fold-head">
          <span class="fold-mark"></span>
          <span class="eyebrow">Earlier in this conversation</span>
          <span class="fold-count" id="chat-archive-count">0</span>
        </summary>
        <div class="fold-body" id="chat-archive-body"></div>
      </details>
      <div class="chat-messages" id="chat-messages"></div>
    </div>
    <p class="chat-pending" id="chat-pending" hidden>
      <span class="lamp lamp-brass lamp-pulse" aria-hidden="true"></span>
      <span id="chat-pending-text"></span>
    </p>
    <!-- Its own row: a send that failed must not be erased by the next
         successful poll a few seconds later. -->
    <p class="chat-error" id="chat-error" role="alert" hidden></p>
    <form class="chat-form" id="chat-form">
      <label class="sr-only" for="chat-input">Message the dockmaster</label>
      <textarea id="chat-input" rows="2" placeholder="Ask for work, or answer a question…"></textarea>
      <button type="submit" class="btn btn-send">Send</button>
    </form>
  </aside>
</div>

<div class="scrim" id="scrim" hidden></div>
<script type="module" src="/console.mjs"></script>
</body>
</html>
